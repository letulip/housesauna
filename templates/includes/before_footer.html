{% load static %}

<section class="grid">
  <article class="grid__article">
    <div class="grid__element grid__element--wide">
      <h2 class="heading heading--h2 heading--bold heading--paddingBottom-50">Напишите нам</h2>

      <ul class="social social__form">
        <li class="social__item social__item--form">
          <a href="https://t.me/Dombanya5" target="_blank" rel="noopener" aria-label="Telegram">
            <svg class="social__icon social__icon--tg" width="40" height="40">
              <use href="{% static 'img/sprite.svg' %}#icon-tg"></use>
            </svg>
          </a>
        </li>
        <li class="social__item social__item--form">
          <a href="https://wa.me/79104084800" target="_blank" rel="noopener" aria-label="Whatsapp">
            <svg class="social__icon social__icon--wa" width="40" height="40">
              <use href="{% static 'img/sprite.svg' %}#icon-wa"></use>
            </svg>
          </a>
        </li>
        <li class="social__item social__item--form">
          <a href="https://vk.com/im?sel=-212663856&entrypoint=community_page" target="_blank" rel="noopener" aria-label="VK">
            <svg class="social__icon social__icon--vk" width="40" height="40">
              <use href="{% static 'img/sprite.svg' %}#icon-vk"></use>
            </svg>
          </a>
        </li>
      </ul>

      <form action="/submit/" class="form form--wide" method="POST"
            style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <label class="form__label" style="width:100%;max-width:400px;">
          <input type="text" name="name" class="form__input form__input--dark" required style="width:100%;">
          <span class="form__placeholder form__placeholder--dark">Ваше имя</span>
        </label>
        <label class="form__label" style="width:100%;max-width:400px;">
          <input type="tel" name="phone" class="form__input form__input--dark form__input--phone" required style="width:100%;" maxlength="15">
          <span class="form__placeholder form__placeholder--dark">Ваш телефон</span>
        </label>
        <label class="form__label" style="width:100%;max-width:400px;">
          <input type="email" name="email" class="form__input form__input--dark" style="width:100%;">
          <span class="form__placeholder form__placeholder--dark">Ваш email (необязательно)</span>
        </label>
        <input type="hidden" name="form_name" value="запросу с общей формы сбора заявок">
        <input type="hidden" name="form_link" value="https://domizkleenogobrusa.ru">

        <button type="submit"
                class="form__submit form__submit--dark form__submit--wide form__submit--center button button--big"
                style="background:#1F57C8;color:#fff;border:1px solid #1F57C8;padding:14px 24px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">
          Позвоните мне
        </button>
        {% csrf_token %}
      </form>

      <p class="text text--sm" style="margin-top:16px;text-align:center;">
        Обработка заявки осуществляется в течение рабочего дня.<br>
        Отправляя заявку, вы соглашаетесь с нашей
        <a href="/policy/" class="text__link" style="color:#1F57C8;">политикой конфиденциальности</a>.
      </p>
    </div>
  </article>
</section>
